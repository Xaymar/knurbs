name: Test Project
on:
  workflow_call:
jobs:
  ubuntu:
    name: Ubuntu 🐧
    runs-on: ubuntu-26.04
    # A hung test must fail the job, not hold the runner for six hours
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Zsh 🛍️
        run: |
          : Install Zsh 🛍️
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH
          brew update
          brew install --quiet zsh

      - name: Install Dependencies 🛍️
        shell: zsh --no-rcs --errexit --pipefail {0}
        run: |
          : Install Dependencies 🛍️

          # Same dependency setup that .github/scripts/build-ubuntu runs (apt packages, VST3 SDK, CEF into .deps).
          install_dependencies() {
            local project_root=${GITHUB_WORKSPACE}
            local SCRIPT_HOME=${project_root}/.github/scripts
            local target=ubuntu-x86_64
            fpath=(${SCRIPT_HOME}/utils.zsh ${fpath})
            autoload -Uz log_group log_error check_ubuntu setup_ubuntu
            # check_ubuntu runs apt-get update and installs the .Aptfile tools (cmake, ninja, jq, ...)
            check_ubuntu
            setup_ubuntu
          }
          install_dependencies
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Configure 🔧
        run: |
          : Configure 🔧
          /usr/bin/cmake --preset ubuntu-ci \
            -DENABLE_UNIT_TESTS=ON \
            -DENABLE_FRONTEND=OFF \
            -DENABLE_BROWSER=OFF \
            -DOBS_VERSION_OVERRIDE=33.0.0 \
            -DCMAKE_PREFIX_PATH:PATH="${GITHUB_WORKSPACE}/.deps"

      - name: Build 🧱
        run: |
          : Build 🧱
          # Everything, not only the unit test targets: some tests need plugins and modules from other targets.
          /usr/bin/cmake --build build_ubuntu --parallel

      - name: Run Unit Tests 🧪
        run: |
          : Run Unit Tests 🧪
          xvfb-run -a ctest --test-dir build_ubuntu --output-on-failure --timeout 600

  windows:
    name: Windows 🪟
    runs-on: windows-2025-vs2026
    # A hung test must fail the job, not hold the runner for six hours
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies 🛍️
        run: |
          # Install Dependencies 🛍️
          # Same winget setup that .github/scripts/Build-Windows.ps1 runs. obs-deps is downloaded by CMake
          # during configure, as it is for the regular build.
          $ErrorActionPreference = 'Stop'
          $OriginalPath = $Env:Path -split ';'
          foreach ($Utility in Get-ChildItem -Path .github/scripts/utils.pwsh/*.ps1 -Recurse) {
            . $Utility.FullName
          }
          Install-BuildDependencies -WingetFile .github/scripts/.Wingetfile
          # Keep only the PATH entries that Install-BuildDependencies added for the following steps.
          $Added = ($Env:Path -split ';') | Where-Object { $_ -and ($OriginalPath -notcontains $_) }
          if ($Added) { Add-Content -Path $Env:GITHUB_PATH -Value $Added }

      - name: Configure 🔧
        run: |
          # Configure 🔧
          cmake --preset windows-ci-x64 `
            '-DENABLE_UNIT_TESTS=ON' `
            '-DENABLE_FRONTEND=OFF' `
            '-DOBS_VERSION_OVERRIDE=33.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build 🧱
        run: |
          # Build 🧱
          # Everything, not only the unit test targets: some tests need plugins and modules from other targets.
          cmake --build --preset windows-x64 --config RelWithDebInfo --parallel '--' '/consoleLoggerParameters:Summary' '/noLogo'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Unit Tests 🧪
        run: |
          # Run Unit Tests 🧪
          ctest --test-dir build_x64 -C RelWithDebInfo --output-on-failure --timeout 600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
